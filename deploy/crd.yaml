apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: nestedclusters.octools.io
  labels:
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
spec:
  group: octools.io
  names:
    kind: NestedCluster
    listKind: NestedClusterList
    plural: nestedclusters
    singular: nestedcluster
    shortNames:
      - nc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: OCP Version
          type: string
          jsonPath: .spec.ocpVersion
        - name: Release
          type: string
          jsonPath: .status.releaseVersion
        - name: Topology
          type: string
          jsonPath: .spec.topology
        - name: API Endpoint
          type: string
          jsonPath: .status.apiEndpoint
          priority: 0
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - clusterName
                - baseDomain
                - namespace
                - ocpVersion
                - topology
                - masters
                - network
                - externalAccess
                - storageClassName
              properties:
                clusterName:
                  type: string
                  description: DNS-safe name for the nested cluster.
                  pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                  maxLength: 63
                baseDomain:
                  type: string
                  description: Base domain for the nested cluster (e.g. example.com).
                  maxLength: 253
                namespace:
                  type: string
                  description: User-specified namespace where all cluster resources will be created.
                  pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                  maxLength: 63
                ocpVersion:
                  type: string
                  description: OpenShift version to deploy (e.g. 4.18.12).
                topology:
                  type: string
                  description: Cluster topology.
                  enum:
                    - compact
                    - ha
                    - custom
                masters:
                  type: object
                  required:
                    - count
                    - cpuCores
                    - memoryGi
                    - diskGi
                  properties:
                    count:
                      type: integer
                      minimum: 3
                      maximum: 3
                      default: 3
                      description: Number of control plane nodes (always 3).
                    cpuCores:
                      type: integer
                      minimum: 4
                      description: CPU cores per master VM.
                    memoryGi:
                      type: integer
                      minimum: 16
                      description: Memory in GiB per master VM.
                    diskGi:
                      type: integer
                      minimum: 120
                      description: Root disk size in GiB per master VM.
                workers:
                  type: object
                  properties:
                    count:
                      type: integer
                      minimum: 0
                      description: Number of worker nodes (0 for compact topology).
                    cpuCores:
                      type: integer
                      minimum: 2
                      description: CPU cores per worker VM.
                    memoryGi:
                      type: integer
                      minimum: 8
                      description: Memory in GiB per worker VM.
                    diskGi:
                      type: integer
                      minimum: 64
                      description: Root disk size in GiB per worker VM.
                infra:
                  type: object
                  description: Infrastructure node configuration (custom topology only).
                  properties:
                    count:
                      type: integer
                      minimum: 0
                      description: Number of infra nodes.
                    cpuCores:
                      type: integer
                      minimum: 4
                      description: CPU cores per infra VM.
                    memoryGi:
                      type: integer
                      minimum: 16
                      description: Memory in GiB per infra VM.
                    diskGi:
                      type: integer
                      minimum: 120
                      description: Root disk size in GiB per infra VM.
                nodeNames:
                  type: array
                  description: Per-node naming overrides. Auto-generated if omitted.
                  items:
                    type: object
                    required:
                      - name
                      - role
                    properties:
                      name:
                        type: string
                        description: Node hostname.
                        pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
                        maxLength: 63
                      role:
                        type: string
                        description: Node role.
                        enum:
                          - master
                          - worker
                          - infra
                network:
                  type: object
                  required:
                    - cudnSubnet
                    - apiVIP
                    - ingressVIP
                  properties:
                    cudnSubnet:
                      type: string
                      description: CIDR for the cUDN Layer2 primary network (e.g. 10.100.0.0/16).
                    apiVIP:
                      type: string
                      description: API virtual IP within the cUDN subnet.
                    ingressVIP:
                      type: string
                      description: Ingress virtual IP within the cUDN subnet.
                    clusterNetworkCIDR:
                      type: string
                      description: Cluster network CIDR for pods.
                      default: "10.128.0.0/14"
                    serviceNetworkCIDR:
                      type: string
                      description: Service network CIDR.
                      default: "172.30.0.0/16"
                    dnsIP:
                      type: string
                      description: IP address of the in-cluster CoreDNS pod on the cUDN (optional, auto-collected if DeployDNS phase runs).
                    networkType:
                      type: string
                      description: >-
                        Network plugin of the nested cluster. OVNKubernetes (default) or the
                        open-source Calico or Cilium (OpenShift 4.22 or later). Fixed at install time.
                      enum:
                        - OVNKubernetes
                        - Calico
                        - Cilium
                    cniVersion:
                      type: string
                      description: >-
                        Calico or Cilium release (for example v3.33.0, v1.20.4); empty means the
                        newest one the orchestrator offers. Must be empty for OVNKubernetes.
                      pattern: '^(v[0-9]+\.[0-9]+\.[0-9]+)?$'
                externalAccess:
                  type: object
                  required:
                    - nadName
                    - apiIP
                    - ingressIP
                  description: HAProxy external access configuration via VLAN NAD.
                  properties:
                    nadName:
                      type: string
                      description: Name of the NetworkAttachmentDefinition for the HAProxy VLAN-side NIC.
                    apiIP:
                      type: string
                      description: Free static IP on the external VLAN for API traffic (api.<cluster>.<domain>). Typed in by the user; never assigned automatically, and must not be an internal VIP.
                    ingressIP:
                      type: string
                      description: Free static IP on the external VLAN for Ingress traffic (*.apps.<cluster>.<domain>). Typed in by the user; never assigned automatically, and must not be an internal VIP.
                    jumpboxIP:
                      type: string
                      description: Optional static IP on the VLAN network for the diagnostics jumpbox VM's second NIC, making it ssh-reachable from outside the machine network (same prefix as apiIP).
                    prefixLength:
                      type: integer
                      minimum: 8
                      maximum: 30
                      description: Prefix length of the external VLAN subnet that apiIP, ingressIP and jumpboxIP live in. Omitted means 24.
                    gateway:
                      type: string
                      description: Gateway of the external VLAN. The bastion answers clients outside the VLAN through it (replies from the API/Ingress addresses use it). Required for new clusters.
                    hostRoutes:
                      type: boolean
                      description: Publish the nested API and console through Routes on the host cluster (host *.apps names), so they work without DNS records for the nested domain. Needs the bastion load balancer and external addresses reachable from the host nodes.
                    ipPool:
                      type: string
                      description: Optional IPPool (same namespace) the external addresses were picked from; the API checks they match it.
                storageClassName:
                  type: string
                  description: StorageClass for VM root disk PVCs.
                pullSecret:
                  type: string
                  description: Inline Red Hat pull secret JSON (stored temporarily, moved to a Secret during CreateSecrets phase).
                sshKey:
                  type: string
                  description: Inline SSH public key (stored temporarily, moved to a Secret during CreateSecrets phase).
                storage:
                  type: object
                  description: >-
                    Expose a host StorageClass inside the nested cluster (KubeVirt CSI driver, split mode).
                    Volumes are hot-plugged DataVolumes in this cluster's namespace.
                  properties:
                    enabled:
                      type: boolean
                    infraStorageClassName:
                      type: string
                      description: >-
                        Host StorageClass backing nested volumes. Empty = the host's default
                        virtualization StorageClass, else its default StorageClass.
                    allowanceGi:
                      type: integer
                      minimum: 0
                      description: >-
                        Host storage (GiB) the nested cluster may consume. Enforced with a ResourceQuota
                        on the cluster namespace, on top of the cluster's own disks.
                virtualization:
                  type: object
                  description: >-
                    Install OpenShift Virtualization in the nested cluster and configure CDI for the nested
                    storage. Implies storage.enabled.
                  properties:
                    enabled:
                      type: boolean
                bastion:
                  type: object
                  description: >-
                    The single helper VM (nested DNS + MCS relay + SSH). With graphical enabled it also
                    gets a desktop, so the nested console can be opened in a browser ON the bastion via
                    the OpenShift VM console - the bastion already resolves the nested zone, so this
                    needs no Route and no extra network exposure.
                  properties:
                    graphical:
                      type: boolean
                      description: Install a desktop (XFCE + Firefox) on the bastion. Raises it to 2 vCPU / 4 GiB.
                    username:
                      type: string
                      description: Desktop login name. Defaults to "core", the same identity used for SSH.
                    password:
                      type: string
                      description: >-
                        Desktop password. Write-only - the orchestrator copies it into the
                        <cluster>-bastion-password Secret and clears this field. Leave empty to have
                        one generated.
                sshPrivateKey:
                  type: string
                  description: Inline SSH private key matching sshKey. Required by the ConfigureNodes phase, which SSHes into nested VMs (as a Job inside the cluster namespace) to correct UDN-supplied DNS and discover the rendezvous node.
                sshPrivateKeyRef:
                  type: object
                  description: Reference to a kubernetes.io/ssh-auth Secret in the operator namespace holding the private key (alternative to sshPrivateKey).
                  properties:
                    name:
                      type: string
                pullSecretRef:
                  type: object
                  description: Reference to the Secret containing the Red Hat pull secret (set by CreateSecrets phase).
                  properties:
                    name:
                      type: string
                sshKeyRef:
                  type: object
                  description: Reference to the Secret containing the SSH public key (set by CreateSecrets phase).
                  properties:
                    name:
                      type: string
                installConfigOverrides:
                  type: string
                  description: User-provided YAML overrides for install-config.yaml (merged on top of generated config).
                agentConfigOverrides:
                  type: string
                  description: User-provided YAML overrides for agent-config.yaml (merged on top of generated config).
                source:
                  type: object
                  description: Clone this cluster from a master (Express) instead of installing it.
                  required: [master]
                  properties:
                    master:
                      type: string
                      description: Name of a NestedCluster in phase Master (same namespace).
                    internalName:
                      type: string
                      description: The master's cluster name; the cloned nodes keep it internally.
                    internalBaseDomain:
                      type: string
                      description: The master's base domain.
            status:
              type: object
              properties:
                appRoutes:
                  type: array
                  description: Nested routes published under the host's *.apps (annotation sos.octools.io/publish-host-route).
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      url:
                        type: string
                master:
                  type: object
                  description: Set once the cluster was turned into a master (Express); clones are created from its snapshots.
                  properties:
                    snapshots:
                      type: object
                      additionalProperties:
                        type: string
                      description: Root disk PVC to VolumeSnapshot.
                    releaseVersion:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
                    refreshedAt:
                      type: string
                      format: date-time
                hostConsoleURL:
                  type: string
                  description: Nested console through a host Route (externalAccess.hostRoutes).
                hostAPIURL:
                  type: string
                  description: Nested API through a host Route (externalAccess.hostRoutes).
                releaseVersion:
                  type: string
                  description: OpenShift release spec.ocpVersion resolved to at GenerateISO (e.g. 4.22.22 for "4.22").
                releaseImage:
                  type: string
                  description: Release payload being installed, pinned by digest.
                installerImage:
                  type: string
                  description: The payload's installer image, used by the wait-for Jobs.
                loadBalancer:
                  type: string
                  description: '"bastion" when the API/Ingress load balancer runs on the bastion VM; empty for clusters that use HAProxy pods.'
                phase:
                  type: string
                  description: Current orchestration phase.
                  enum:
                    - Pending
                    - CreateNamespace
                    - CreateNetwork
                    - CreateSecrets
                    - CreateVMs
                    - CollectIPs
                    - DeployRedfish
                    - DeployHAProxy
                    - DeployDNS
                    - GenerateISO
                    - MountISO
                    - SetBootCD
                    - PowerOn
                    - ConfigureNodes
                    - MCSRelay
                    - WaitBootstrap
                    - WaitInstall
                    - PostInstall
                    - PublishRoutes
                    - ConfigureStorage
                    - ConfigureVirtualization
                    - MakeMaster
                    - Master
                    - RefreshMaster
                    - CloneVMs
                    - WaitCloneAPI
                    - Sanitize
                    - CloneCredentials
                    - FinishIsolation
                    - Ready
                    - Deleting
                    - Failed
                message:
                  type: string
                  description: Human-readable message about the current phase.
                startedAt:
                  type: string
                  format: date-time
                  description: Timestamp when orchestration started.
                completedAt:
                  type: string
                  format: date-time
                  description: Timestamp when orchestration completed (Ready or Failed).
                redfishEndpoint:
                  type: string
                  description: URL of the per-cluster redfish-controller Route.
                apiEndpoint:
                  type: string
                  description: Full API URL of the nested cluster (e.g. https://api.<cluster>.<domain>:6443).
                consoleURL:
                  type: string
                  description: Console URL of the nested cluster (e.g. https://console-openshift-console.apps.<cluster>.<domain>).
                ingressDomain:
                  type: string
                  description: Ingress wildcard domain (e.g. *.apps.<cluster>.<domain>).
                kubeconfigSecretRef:
                  type: string
                  description: Name of the Secret containing the nested cluster kubeconfig.
                kubeadminSecretRef:
                  type: string
                  description: Name of the Secret containing the kubeadmin password.
                apiVIPcUDN:
                  type: string
                  description: Actual cUDN IP serving the nested API VIP (assigned to the haproxy-api pod by UDN DHCP).
                ingressVIPcUDN:
                  type: string
                  description: Actual cUDN IP serving the nested ingress VIP.
                dnsIPcUDN:
                  type: string
                  description: cUDN IP of the per-cluster DNS server pod.
                rendezvousIP:
                  type: string
                  description: Node discovered in-cluster as serving the assisted-service (:8090).
                rendezvousNode:
                  type: string
                  description: Name of the rendezvous node.
                mcsRelayIP:
                  type: string
                  description: cUDN IP of the MCS relay VM (host nftables blocks haproxy-pod to VM:22623 traffic; the relay side-steps it from VM side).
                hostAPIRoute:
                  type: string
                  description: Host-cluster Route URL proxying the nested API via the haproxy pod (passthrough; needs --insecure-skip-tls-verify).
                hostConsoleRoute:
                  type: string
                  description: Host-cluster Route URL proxying nested ingress (passthrough; console SNI caveats apply).
                installConfig:
                  type: string
                  description: Sanitized install-config.yaml content (pull secret and SSH key redacted).
                agentConfig:
                  type: string
                  description: Generated agent-config.yaml content.
                nodes:
                  type: array
                  description: Per-node status.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Node hostname.
                      role:
                        type: string
                        description: Node role (master, worker, infra).
                        enum:
                          - master
                          - worker
                          - infra
                      vmStatus:
                        type: string
                        description: KubeVirt VirtualMachine status.
                        enum:
                          - Created
                          - Running
                          - Stopped
                          - Error
                          - Unknown
                      powerState:
                        type: string
                        description: VM power state from Redfish.
                        enum:
                          - "On"
                          - "Off"
                          - Unknown
                      bootPhase:
                        type: string
                        description: Current boot phase.
                        enum:
                          - ISO
                          - Disk
                          - Unknown
                      agentStatus:
                        type: string
                        description: Agent-based installer agent status.
                        enum:
                          - Pending
                          - Discovering
                          - Installing
                          - Installed
                          - Error
                          - Unknown
                      ip:
                        type: string
                        description: IP address assigned to the node on the cUDN.
                      mac:
                        type: string
                        description: MAC address of the node's primary network interface.
                phaseHistory:
                  type: array
                  description: History of phase transitions with timing.
                  items:
                    type: object
                    properties:
                      phase:
                        type: string
                        description: The phase name.
                      startedAt:
                        type: string
                        format: date-time
                        description: When this phase started.
                      endedAt:
                        type: string
                        format: date-time
                        description: When this phase ended.
                      message:
                        type: string
                        description: Phase outcome message.
                      success:
                        type: boolean
                        description: Whether the phase completed successfully.
                conditions:
                  type: array
                  description: Standard Kubernetes conditions.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: Condition type (e.g. Ready, Progressing, Degraded).
                      status:
                        type: string
                        description: Condition status.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                        description: Machine-readable reason for the condition.
                      message:
                        type: string
                        description: Human-readable message.
                      lastTransitionTime:
                        type: string
                        format: date-time
                        description: Last time the condition transitioned.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ippools.octools.io
  labels:
    app.kubernetes.io/part-of: oct-shift-on-shift-virt
spec:
  group: octools.io
  names:
    kind: IPPool
    listKind: IPPoolList
    plural: ippools
    singular: ippool
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.nadName
        - name: Prefix
          type: integer
          jsonPath: .spec.prefixLength
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: >-
            Free addresses on one external VLAN that people creating nested
            clusters pick from. Usage is not stored: an address is in use while
            a NestedCluster on the same network references it.
          properties:
            spec:
              type: object
              required:
                - nadName
                - prefixLength
                - addresses
                - gateway
              properties:
                nadName:
                  type: string
                  pattern: '^default/[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                  description: default/<name> of the external VLAN's NetworkAttachmentDefinition. Pools are shared, so only NADs in the default namespace are allowed.
                prefixLength:
                  type: integer
                  minimum: 8
                  maximum: 30
                  description: Prefix length of the VLAN subnet.
                addresses:
                  type: array
                  minItems: 1
                  description: Single IPv4 addresses or inclusive ranges a.b.c.d-a.b.c.e (at most 4096 addresses in total).
                  items:
                    type: string
                gateway:
                  type: string
                  description: Gateway of the VLAN (required). Clusters answer clients outside the VLAN through it. Must not be one of the addresses.
                description:
                  type: string
